name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'

permissions:
  contents: write
  packages: write

jobs:
  build_apk:
    name: Build, Release & Publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Release APK
        id: prep
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            PKG_VERSION="${VERSION_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
            PKG_VERSION="${VERSION_NAME}.${{ github.run_number }}"
          fi
          mkdir -p ../../dist
          APK_NAME="tress-v${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "../../dist/${APK_NAME}"
          cp app/build/outputs/apk/release/output-metadata.json "../../dist/output-metadata.json"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tress-v${{ steps.prep.outputs.version_name }}-apk
          path: ${{ steps.prep.outputs.apk_path }}

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.release_tag }}
          name: Tress v${{ steps.prep.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.apk_path }}
            dist/output-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to GitHub Packages
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B deploy:deploy-file \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -DgroupId=com.google.aiedge.gallery \
            -DartifactId=tress-android \
            -Dversion="${{ steps.prep.outputs.pkg_version }}" \
            -Dpackaging=apk \
            -Dfile="${{ steps.prep.outputs.apk_path }}"
